name: Sync Main to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  sync-branches:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # <-- Permissão essencial para o robô criar PR
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar Pull Request Automático para Develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verifica se a develop já tem tudo da main. Se não tiver, abre o PR.
          gh pr create \
            --base develop \
            --head main \
            --title "chore: backmerge automático da main para a develop" \
            --body "Sincronização gerada automaticamente pelo GitHub Actions para manter a \`develop\` atualizada após a última entrega na \`main\`." || echo "PR já existe ou não há mudanças."